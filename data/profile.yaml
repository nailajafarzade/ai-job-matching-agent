# profile.yaml — the single source of truth for the agent.
# RULE: write only what is really true. The agent never uses anything
# that is not in this file (no invented skills, experience or dates).
# When you change this file, raise `version` by 1.
#
# Two things are kept apart on purpose:
#   skills    = what I can do (level: hands_on | studied)
#   projects  = what a project really used (tech_confirmed)
# Having a skill does not prove a project used it.

