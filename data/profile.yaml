  - {title: Full Stack Developer,     priority: secondary}

# Used by the hard filter (stage 1 of matching).
preferences:
  max_years_required: 2              # reject jobs that require more than this
  reject_seniority: [senior, lead, principal, staff, manager]
  home_country: Azerbaijan
  excluded_job_countries: [India]    # the only excluded country
  preferred_locations: [Baku, Azerbaijan]
  remote:
    ok: true
    # Open to any country, if the job accepts remote workers from Azerbaijan.
    # A remote job is not enough: its country eligibility is checked separately.
    # If eligibility is unknown, the job is flagged for manual review (not rejected).
    require_country_eligibility: true
    # Planned job fields (added in the job schema later):
    #   eligible_countries, remote_work_eligibility, location_restrictions

