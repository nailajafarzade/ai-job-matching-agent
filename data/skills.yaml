# skills.yaml — vocabulary used to RECOGNIZE skills in a job text.
# It is NOT a list of my skills. My skills are only in profile.yaml.
# A skill in this file that is missing from profile.yaml is simply
# "required by the job, not mine" and shows up in missing_skills.
#
# canonical : the one name used everywhere
# synonyms  : only true alternative names (same technology). Case-insensitive.
# related   : connected technologies that are DIFFERENT skills. They never
#             count as a match. Later they may be used for explanations only.
#             One direction only: "FastAPI related Python" is enough.
# weight    : importance in scoring (1 = small, 3 = core)
#
# Example: "Spring" -> Spring Framework (not Spring Boot).
# Note: "DSA" (data structures and algorithms) names two skills. The analyzer
# should later emit both Data Structures and Algorithms for it.

